server:
  port: ${PORT:8080}

spring:
  application:
    name: sistema-pedidos-ropa
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce-ropa}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: com.sistemapedidos.common.config.QuotedPhysicalNamingStrategy
      properties:
        hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # La BD existente (creada por Prisma) ya tiene el schema: se toma como baseline.
    # En una BD nueva y vacia, Flyway aplica V1 normalmente.
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB

app:
  jwt-secret: ${JWT_SECRET:default-secret-change-in-production}
  jwt-expires-in: ${JWT_EXPIRES_IN:24h}
  cors-origin: ${FRONTEND_URL:}
  api-url: ${API_URL:http://localhost:8080}
  whatsapp-number: ${WHATSAPP_NUMBER:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

springdoc:
  swagger-ui:
    path: /api

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.hibernate.SQL: warn
